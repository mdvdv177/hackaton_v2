name: transport-predictor

x-python: &python
  image: transport-predictor-python:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: predictor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictor-local-demo}
      POSTGRES_DB: predictor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictor -d predictor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ml:
    <<: *python
    command: ["python", "-m", "uvicorn", "ml.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MODEL_DIR: /app/artifacts/models
      REQUIRED_MODEL_PROFILES: official,stream
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *python
    environment:
      DATABASE_URL: postgresql+psycopg://predictor:${POSTGRES_PASSWORD:-predictor-local-demo}@postgres:5432/predictor
      DATA_DIR: /app/dataset
      ML_URL: http://ml:8001
      NDTP_HOST: 0.0.0.0
      NDTP_PORT: 9201
    volumes:
      - ./dataset:/app/dataset:ro
    ports:
      - "${BACKEND_PORT:-8010}:8000"
      - "${NDTP_PORT:-9211}:9201"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    image: transport-predictor-frontend:local
    build: ./frontend
    ports:
      - "${DASHBOARD_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  emulator:
    profiles: ["ndtp"]
    image: ndtp-telemetry-emulator:1.0
    platform: linux/amd64
    ports:
      - "${EMULATOR_PORT:-18080}:18080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
